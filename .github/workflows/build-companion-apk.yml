name: Build Phone Companion APK

on:
  workflow_dispatch:
  push:
    branches: [feat/phone-companion]
    paths: ["companion/**", ".github/workflows/build-companion-apk.yml"]

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Test and build
        working-directory: companion
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      - id: apk
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          sha256sum companion/app/build/outputs/apk/*/*.apk >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Companion-${{ steps.apk.outputs.short_sha }}
          path: |
            companion/app/build/outputs/apk/debug/app-debug.apk
            companion/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
