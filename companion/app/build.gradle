plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome.companion'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome.companion'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: the debug key is enough to install over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Wireless ADB client: Apache-2.0, https://github.com/mobile-dev-inc/dadb
    implementation 'dev.mobile:dadb:1.2.10'
    testImplementation 'junit:junit:4.13.2'
}
